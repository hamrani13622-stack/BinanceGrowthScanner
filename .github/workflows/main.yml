
name: Build Binance Scanner APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BinanceGrowthScannerAndroid_MobileBuild.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o BinanceGrowthScannerAndroid_MobileBuild.zip -d project
          ls -la project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BinanceGrowthScanner-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
