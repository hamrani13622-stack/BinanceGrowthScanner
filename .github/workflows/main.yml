
name: Build Binance Scanner APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BinanceGrowthScannerAndroid_MobileBuild.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o BinanceGrowthScannerAndroid_MobileBuild.zip -d project
          find project -name settings.gradle -type f

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find project -name settings.gradle -type f -print -quit)")"
          test -f "$PROJECT_DIR/app/build.gradle"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BinanceGrowthScanner-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
